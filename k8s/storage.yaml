apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: personal-ai-data-pvc
  namespace: personal-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: personal-ai-model-cache-pvc
  namespace: personal-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
