apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-ai-frontend
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-ai-frontend
  template:
    metadata:
      labels:
        app: personal-ai-frontend
    spec:
      containers:
        - name: frontend
          image: personal-ai-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
