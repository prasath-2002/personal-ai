apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-ai-ingress
  namespace: personal-ai
spec:
  rules:
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /config
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /reset
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /history
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /sessions
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /documents
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: personal-ai-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: personal-ai-frontend-service
                port:
                  number: 3000
